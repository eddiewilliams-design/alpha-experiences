<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0;url=/auth/login">
<title>Alpha Experiences</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#072256;color:#FAFAFA;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .box{text-align:center;padding:2rem;}
  .spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,0.2);border-top-color:#FAFAFA;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  p{font-size:13px;color:#8291AA;margin:0;}
  a{color:#006FF9;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" aria-hidden="true"></div>
  <p>Taking you to <a href="/auth/login">sign in</a>…</p>
</div>
<script>window.location.replace('/auth/login');</script>
</body>
</html>
